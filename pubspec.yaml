name: yarc
description: "Yet Another Reddit Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  app_links: ^7.2.1
  cached_network_image: ^3.3.1
  chewie: ^1.13.0
  draw: ^1.0.2
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.3.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.0
  flutter_secure_storage: ^10.3.4
  flutter_web_auth_2: ^5.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  markdown: ^7.3.0
  provider: ^6.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  video_player: ^2.10.1
  visibility_detector: ^0.4.0+2
  youtube_player_flutter: ^9.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.1.0

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon.png"

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
